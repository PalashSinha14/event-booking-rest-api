<!DOCTYPE html>
<html>
<head>
<title>Dashboard</title>
<link rel="stylesheet" href="/static/CSS/styles.css">
<style>
.abcd footer{
    text-align: center;
    padding: 10px 20px;
}
</style>

</head>

<body>

{{template "navbar" .}}

<div class="container">

<h1>Dashboard</h1>
<h2>Welcome back, {{.email}} 👋</h2>
<p><b>Welcome to Event Booking Platform</b></p>

<div class="actions-grid">
<a class="action-card" href="/events-page">
    <span class="action-icon">📋</span>
    <span class="action-label">View Events</span>
</a>
<a class="action-card" href="/create-event">
    <span class="action-icon">➕</span>
    <span class="action-label">Create Event</span>
</a>
<a class="action-card" href="/register-page">
    <span class="action-icon">📝</span>
    <span class="action-label">Register Event</span>
</a>
<a class="action-card" href="/my-events-page">
    <span class="action-icon">🗂️</span>
    <span class="action-label">My Events</span>
</a>
<a class="action-card" href="/my-registrations-page">
    <span class="action-icon">🎫</span>
    <span class="action-label">My Registrations</span>
</a>
</div>

</div>

<div class="abcd">

<footer>
    <p>&copy; By Palash Sinha-2026 </p>
    <p>All rights reserved</p>
</footer>

</div>

</body>
</html>
